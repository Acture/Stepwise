# cargo-about's configuration for the third-party licence notices that `.github/workflows/package.yml`
# puts in every archive. Only these licences are accepted, in order of preference where a crate
# offers a choice, so a dependency under any other licence stops the packaging run until someone
# has read that licence and added it here.
accepted = [
	"Apache-2.0",
	"MIT",
	"Unicode-3.0",
	"Unicode-DFS-2016",
	"Zlib",
	"MPL-2.0",
	"BSD-3-Clause",
	"ISC",
]
# Build scripts and tests run where the binary is built and are not part of it.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Stepwise's own licence, accepted for its own crate alone: `about.hbs` leaves that group out of
# the third-party notices, and a dependency under it would stop the run like any other.
[stepwise]
accepted = ["AGPL-3.0-only"]

[stepwise-desktop]
accepted = ["AGPL-3.0-only"]

