name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked
      - name: Compare with CPython
        if: runner.os == 'Linux'
        run: cargo +stable test --locked --test python_oracle -- --ignored --nocapture
      - name: Drive the terminal through a pty
        if: runner.os != 'Windows'
        run: cargo +stable test --locked --test terminal -- --ignored --nocapture
      - run: cargo +stable run --locked -- --logic --proof raa --check-proof tests/fixtures/raa.json

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: oven-sh/setup-bun@v2
      - name: WebKitGTK and GTK for the window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      # bash, so a failing check stops the step on Windows too: PowerShell carries on past a
      # native command's exit code and would report only the last one.
      - name: The page
        working-directory: desktop/ui
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run lint
          bun run build
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --locked -p stepwise-desktop --all-targets -- -D warnings
      # A release build embeds the built page; this compiles that path, after `bun run build`.
      - run: cargo +stable check --locked -p stepwise-desktop --features tauri/custom-protocol
      # The shell's own tests: progress written, refused and left alone. They open no window.
      - run: cargo +stable test --locked -p stepwise-desktop
      - name: The page's protocol matches the Rust types
        if: runner.os == 'Linux'
        run: |
          cargo +stable test --locked --lib desktop
          # Untracked counts too: a new exported type whose declaration was never committed.
          drift="$(git status --porcelain -- desktop/ui/src/lib/protocol)"
          if [ -n "$drift" ]; then
            echo "$drift"
            git diff desktop/ui/src/lib/protocol
            exit 1
          fi

  binary:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            extension: ''
          - os: macos-latest
            extension: ''
          - os: windows-latest
            extension: '.exe'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable build --release --locked
      - run: tar -czf stepwise.tar.gz LICENSE README.md -C target/release stepwise${{ matrix.extension }}
      - uses: actions/upload-artifact@v4
        with:
          name: stepwise-${{ runner.os }}-${{ runner.arch }}
          path: stepwise.tar.gz
          if-no-files-found: error
