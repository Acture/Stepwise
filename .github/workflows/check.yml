name: Check

on:
  push:
  pull_request:
  workflow_dispatch:
  # package.yml's first job: it packages only a commit that passed all of this.
  workflow_call:

permissions:
  contents: read

# Called from package.yml this is evaluated in the caller's context, so the workflow in the name
# keeps a packaging run's gate out of the group a Check run on the same ref takes. A run started by
# hand queues behind one already running in its group instead of cancelling it.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s scripts/package -v

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked
      - name: Compare with CPython
        if: runner.os == 'Linux'
        run: cargo +stable test --locked --test python_oracle -- --ignored --nocapture
      - name: Drive the terminal through a pty
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Development regression uses an explicitly identified debug binary; the packaging
          # acceptance jobs set these two variables to their downloaded archive's binary.
          cargo +stable build --locked
          export STEPWISE_BINARY="$PWD/target/debug/stepwise"
          if command -v sha256sum >/dev/null; then
            STEPWISE_BINARY_SHA256="$(sha256sum "$STEPWISE_BINARY" | cut -d ' ' -f 1)"
          else
            STEPWISE_BINARY_SHA256="$(shasum -a 256 "$STEPWISE_BINARY" | cut -d ' ' -f 1)"
          fi
          export STEPWISE_BINARY_SHA256
          cargo +stable test --locked --test terminal -- --ignored --nocapture
      - run: cargo +stable run --locked -- --logic --proof raa --check-proof tests/fixtures/raa.json

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: oven-sh/setup-bun@v2
      - name: WebKitGTK and GTK for the window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      # bash, so a failing check stops the step on Windows too: PowerShell carries on past a
      # native command's exit code and would report only the last one.
      - name: The page
        working-directory: desktop/ui
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run lint
          bun run build
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --locked -p stepwise-desktop --all-targets -- -D warnings
      # A release build embeds the built page; this compiles that path, after `bun run build`.
      - run: cargo +stable check --locked -p stepwise-desktop --features tauri/custom-protocol
      # The shell's own tests: progress and appearance written, refused and left alone, themes
      # read and mapped. Installed faces are enumerated only on macOS. They open no window.
      - run: cargo +stable test --locked -p stepwise-desktop
      # The desk's types write their declarations from the library's tests, the appearance's
      # from the shell's.
      - name: The page's protocol matches the Rust types
        if: runner.os == 'Linux'
        run: |
          cargo +stable test --locked --lib desktop
          cargo +stable test --locked -p stepwise-desktop
          # Untracked counts too: a new exported type whose declaration was never committed.
          drift="$(git status --porcelain -- desktop/ui/src/lib/protocol)"
          if [ -n "$drift" ]; then
            echo "$drift"
            git diff desktop/ui/src/lib/protocol
            exit 1
          fi
