name: Package Desktop

# By hand only: GitHub offers the run once this file is on the default branch, and it packages the
# commit it was started on after that commit has passed the tests.
on:
  workflow_dispatch:

permissions:
  contents: read

# Not test.yml's group: the tests called below take test-Package Desktop-<ref> in this run's context, and a
# caller sharing its callee's group deadlocks. A second run on the same ref waits for the first.
concurrency:
  group: package-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  # The day's stable, the channel the tests in this same run use: Stepwise follows the latest
  # release and leans on nothing a compiler update changes. The runner images below are named
  # instead, so a move between images is a commit and not a rollout landing mid-run.
  RUSTUP_TOOLCHAIN: stable

# bash everywhere, Windows included: it stops on a failed command inside a pipeline, and PowerShell
# reports only the last native exit code.
defaults:
  run:
    shell: bash

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      family: desktop

  # Beside the tests, like the CLI's notices in package-cli.yml.
  desktop-notices:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: cargo install --locked --features cli cargo-about@0.9.2
      - name: The desktop's Rust licences, including its embedded-page features
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            notice="desktop-notices/$target/THIRD-PARTY-NOTICES.txt"
            mkdir -p "desktop-notices/$target"
            cargo about generate --locked --fail -m src/desktop/src-tauri/Cargo.toml --features tauri/custom-protocol --config about.toml --target "$target" --format json --output-file "$RUNNER_TEMP/$target.json"
            cargo about generate --locked --fail -m src/desktop/src-tauri/Cargo.toml --features tauri/custom-protocol --config about.toml --target "$target" --output-file "$notice" about.hbs
            python .github/scripts/check_rust_notices.py "$RUNNER_TEMP/$target.json" "$notice"
            cp "$(rustc --print sysroot)/share/doc/rust/COPYRIGHT-library.html" "desktop-notices/$target/RUST-STD-COPYRIGHT.html"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-notices
          path: desktop-notices
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Desktop ${{ matrix.target }}
    needs: [test, desktop-notices]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-apple-darwin
            os: macos-26
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    # On macOS two notarizations follow the build: the app's inside `tauri build`, then the dmg's.
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Pinned to a commit like tauri-action below: this Bun runs `tauri build`, which signs.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # As in the CLI job: every credential, before the build. The keychain is on the search list,
      # where `tauri build` finds the identity it is named; Tauri's own import of
      # APPLE_CERTIFICATE would take the first identity in the .p12 instead.
      - name: Signing keychain and notary key
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: python .github/scripts/apple.py setup
      - name: Rust targets
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "$TARGET"
          if [ "$RUNNER_OS" = macOS ]; then
            rustup target add --toolchain "$RUSTUP_TOOLCHAIN" aarch64-apple-darwin x86_64-apple-darwin
          fi
      - name: Linux build and extraction tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xdg-utils libarchive-tools
      - name: Locked page and Tauri CLI
        working-directory: src/desktop/ui
        run: |
          bun install --frozen-lockfile
          bun run tauri --version
          # Log and compare the installed CLI with the package recorded in bun.lock.
          bun -e 'const p = require("./node_modules/@tauri-apps/cli/package.json"); const lock = Bun.JSON5.parse(await Bun.file("bun.lock").text()); if (lock.packages["@tauri-apps/cli"][0] !== p.name + "@" + p.version) throw new Error("Tauri CLI differs from bun.lock"); console.log("Locked Tauri CLI:", p.version);'
      - uses: actions/download-artifact@v4
        with:
          name: desktop-notices
          path: desktop-notices
      - name: Stage this target's notices
        run: |
          mkdir -p target/desktop-notices
          cp "desktop-notices/$TARGET/"* target/desktop-notices/
      # The CLI is resolved in ui's node_modules; the action works in src-tauri. Without an
      # explicit script it may install a global CLI. No tag/release input or write permission.
      # Pinned to a commit: on macOS it runs with the notary key and the signing identity.
      # There APPLE_SIGNING_IDENTITY overrides the configuration's ad-hoc "-", `tauri build` signs
      # the app and the dmg, and notarizes and staples the app; APPLE_API_KEY_PATH came from the
      # keychain step. Elsewhere these are empty and unused.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
        with:
          projectPath: src/desktop/src-tauri
          tauriScript: bun ../ui/node_modules/@tauri-apps/cli/tauri.js
          args: --target ${{ matrix.target }} --config tauri.package.conf.json -- --locked
      # Tauri signs the dmg but neither notarizes nor staples it. Stapling rewrites the dmg, so
      # this comes before verify.py, which copies and hashes it and checks the tickets of the dmg
      # and of the app inside it: Tauri ignores a failed staple of the app.
      - name: Notarize and staple the dmg
        if: runner.os == 'macOS'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: python .github/scripts/apple.py notarize --staple target/"$TARGET"/release/bundle/dmg/*.dmg
      # Windows builds the student's NSIS installer above, which downloads WebView2 when it is
      # missing. The MSI is for machines an administrator sets up, often offline: bundled from the
      # same executable, it carries Microsoft's standalone WebView2 installer, fetched now.
      - name: Offline MSI from the same executable
        if: runner.os == 'Windows'
        working-directory: src/desktop/src-tauri
        run: bun ../ui/node_modules/@tauri-apps/cli/tauri.js bundle --target "$TARGET" --config tauri.package.conf.json --config tauri.msi.conf.json
      - name: Read back every installer, verify licences and measure GLIBC
        run: python .github/scripts/verify.py --target "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 7
      - name: GLIBC requirements of every ELF in the AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-glibc
          path: target/package-evidence/GLIBC.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove the signing keychain and notary key
        if: always() && runner.os == 'macOS'
        run: python .github/scripts/apple.py cleanup

  checksums:
    # Only once every target has passed: a partial set is never described as complete, though each
    # successful target keeps its own installer artifact.
    needs: desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        working-directory: dist
        run: |
          for sum in *.sha256; do
            printf '%s  %s\n' "$(cat "$sum")" "${sum%.sha256}"
          done > SHA256SUMS
          rm -- *.sha256
          cat SHA256SUMS
          # A malformed line must fail too; otherwise an uncheckable installer can be skipped.
          sha256sum --strict --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: stepwise-desktop
          path: dist
          if-no-files-found: error
          retention-days: 7
