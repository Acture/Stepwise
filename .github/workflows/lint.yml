name: Lint

# Pull requests only, and only the checks for what the pull request touches (changes.py).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On Linux alone: the few lines behind a macOS or Windows cfg are compiled on their own systems
  # by test.yml, and only their lint warnings go unseen here.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/changes.py --base "$BASE" --head "$HEAD"
      - if: steps.changes.outputs.rustfmt == 'true' || steps.changes.outputs.cli == 'true' || steps.changes.outputs.desktop == 'true'
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - if: steps.changes.outputs.rustfmt == 'true'
        run: cargo +stable fmt --all --check
      - if: steps.changes.outputs.page == 'true'
        uses: oven-sh/setup-bun@v2
      - name: The page's types and format
        if: steps.changes.outputs.page == 'true'
        working-directory: src/desktop/ui
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run lint
      - if: steps.changes.outputs.cli == 'true'
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: WebKitGTK and GTK for the window
        if: steps.changes.outputs.desktop == 'true'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - if: steps.changes.outputs.desktop == 'true'
        run: cargo +stable clippy --locked -p stepwise-desktop --all-targets -- -D warnings
