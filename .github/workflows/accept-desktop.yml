name: Accept desktop installers

# Called once the installers are built and inspected. Each job takes one installer from the
# caller's run by its exact file name — no pattern, so a missing one fails — installs it or opens
# it as a student would, and runs what was installed: the shipped bytes, with no test code in
# them. The artifact names are inputs so a later caller can hand these jobs other installers.
on:
  workflow_call:
    inputs:
      version:
        description: The desktop crate's version, which every installer's file name carries
        required: true
        type: string
      windows:
        type: string
        default: installers-x86_64-pc-windows-msvc
      linux:
        type: string
        default: installers-x86_64-unknown-linux-gnu
      macos-arm64:
        type: string
        default: installers-aarch64-apple-darwin
      macos-x64:
        type: string
        default: installers-x86_64-apple-darwin

permissions:
  contents: read

# A called workflow inherits none of its caller's env or defaults. No concurrency group either:
# one named like the caller's would deadlock it.
env:
  RUSTUP_TOOLCHAIN: stable
  TAURI_DRIVER_VERSION: 2.1.0

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Drive Windows ${{ matrix.format }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One runner each: an MSI installed after the NSIS installer would reuse its
          # directory, and the per-machine installation would go untested.
          - format: nsis
            suffix: -setup.exe
          - format: msi
            suffix: .msi
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      INSTALLER: stepwise-desktop-${{ inputs.version }}-x86_64-pc-windows-msvc${{ matrix.suffix }}
      # gsudo's portable release, pinned by version and by the bytes of its archive (the same
      # digest the release publishes beside it).
      GSUDO_VERSION: 2.6.1
      GSUDO_SHA256: 21130bf178d7b9891207f00bff56f05b6b363ce9cec7b2d084e45fb12ee51f44
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.windows }}
          path: downloaded
      - name: The exact installer, held to its packaging job's hash
        run: python scripts/package/accept_desktop.py --evidence evidence identify --artifacts downloaded --name "$INSTALLER"
      # As administrator, as the runner runs everything; only the suite drops to Medium below.
      - name: Install silently
        id: install
        run: python scripts/package/accept_desktop.py --evidence evidence install --installer "downloaded/$INSTALLER"
      # The runtime the app renders with, which msedgedriver must match; the driver preinstalled
      # on the image follows the Edge browser instead.
      - name: msedgedriver for this machine's WebView2 runtime
        id: webview2
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          key='HKLM\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          version="$(reg query "$key" /v pv | tr -d '\r' | awk '$1 == "pv" { print $3 }')"
          if ! grep -qE '^[0-9]+(\.[0-9]+){3}$' <<<"$version"; then
            echo "::error::no WebView2 runtime version under $key"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/msedgedriver"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/msedgedriver.zip" "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip"
          7z x -y -o"$RUNNER_TEMP/msedgedriver" "$RUNNER_TEMP/msedgedriver.zip"
          driver="$RUNNER_TEMP/msedgedriver/msedgedriver.exe"
          reported="$("$driver" --version | tr -d '\r')"
          if ! grep -qF " $version " <<<"$reported "; then
            echo "::error::msedgedriver reports '$reported', not WebView2 $version"
            exit 1
          fi
          printf 'WebView2 runtime %s\n%s\n' "$version" "$reported" | tee evidence/webview2.txt
          echo "driver=$(cygpath -w "$driver")" >> "$GITHUB_OUTPUT"
      - name: gsudo
        id: gsudo
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gsudo.zip" "https://github.com/gerardog/gsudo/releases/download/v$GSUDO_VERSION/gsudo.portable.zip"
          echo "$GSUDO_SHA256  $RUNNER_TEMP/gsudo.zip" | sha256sum -c -
          7z x -y -o"$RUNNER_TEMP/gsudo" "$RUNNER_TEMP/gsudo.zip"
          echo "gsudo=$RUNNER_TEMP/gsudo/x64/gsudo.exe" >> "$GITHUB_OUTPUT"
          # Under the user's own temporary directory, which a Medium-integrity process of the
          # same user can write to.
          medium="$(cygpath -u "$LOCALAPPDATA")/Temp/stepwise-medium"
          mkdir -p "$medium/evidence"
          echo "MEDIUM=$medium" >> "$GITHUB_ENV"
      # On its own first, so a gsudo that cannot lower the token fails here and says so. The
      # lowered process does not write to this step's pipes, so it writes a file.
      - name: A process gsudo starts runs at Medium integrity
        env:
          GSUDO: ${{ steps.gsudo.outputs.gsudo }}
          MSYS_NO_PATHCONV: 1
        run: |
          groups="$(cygpath -w "$MEDIUM")\\groups.csv"
          # Windows' own whoami: Git's coreutils come first on this PATH.
          "$GSUDO" -d -i Medium cmd.exe /d /c "%SystemRoot%\System32\whoami.exe /groups /fo csv /nh > $groups"
          tr -d '\r' < "$MEDIUM/groups.csv" > evidence/integrity.csv
          grep 'S-1-16-' evidence/integrity.csv
          if ! grep -q 'S-1-16-8192' evidence/integrity.csv; then
            echo "::error::gsudo -i Medium did not give a Medium-integrity process"
            exit 1
          fi
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - run: cargo install tauri-driver --locked --version "$TAURI_DRIVER_VERSION"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - working-directory: desktop/e2e
        run: bun install --frozen-lockfile
      # The suite, tauri-driver, msedgedriver and the app all run at Medium. Their reports land
      # in files, copied into this job's evidence whatever the outcome.
      - name: Drive the installed window at Medium integrity
        working-directory: desktop/e2e
        env:
          GSUDO: ${{ steps.gsudo.outputs.gsudo }}
          STEPWISE_APP: ${{ steps.install.outputs.app }}
          STEPWISE_NATIVE_DRIVER: ${{ steps.webview2.outputs.driver }}
          MSYS_NO_PATHCONV: 1
        run: |
          STEPWISE_EVIDENCE="$(cygpath -w "$MEDIUM/evidence")"
          TAURI_DRIVER="$(cygpath -w "$(command -v tauri-driver)")"
          export STEPWISE_EVIDENCE TAURI_DRIVER
          status=0
          "$GSUDO" -d -i Medium "$(cygpath -w "$(command -v node)")" --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=spec "--test-reporter-destination=$STEPWISE_EVIDENCE\\suite.log" \
            "$(cygpath -w "$PWD/window.test.ts")" || status=$?
          cp -R "$MEDIUM/evidence/." "$GITHUB_WORKSPACE/evidence/"
          if [ -f "$GITHUB_WORKSPACE/evidence/suite.log" ]; then cat "$GITHUB_WORKSPACE/evidence/suite.log"; fi
          exit "$status"
      - name: The drivers' log
        if: ${{ !cancelled() }}
        run: if [ -f evidence/tauri-driver.log ]; then cat evidence/tauri-driver.log; fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: desktop-evidence-windows-${{ matrix.format }}
          path: evidence
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Drive Linux ${{ matrix.format }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            suffix: .deb
          - format: AppImage
            suffix: .AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      INSTALLER: stepwise-desktop-${{ inputs.version }}-x86_64-unknown-linux-gnu${{ matrix.suffix }}
      # The runner has no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.linux }}
          path: downloaded
      - name: The exact installer, held to its packaging job's hash
        run: python scripts/package/accept_desktop.py --evidence evidence identify --artifacts downloaded --name "$INSTALLER"
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
      # The deb first, so its own dependencies are what bring WebKitGTK.
      - name: Install
        id: install
        run: python scripts/package/accept_desktop.py --evidence evidence install --installer "downloaded/$INSTALLER"
      # From the same source package as libwebkit2gtk-4.1, so the driver speaks its version.
      - name: WebKitGTK's WebDriver and an X server
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y webkit2gtk-driver xvfb
          dpkg-query -W libwebkit2gtk-4.1-0 webkit2gtk-driver | tee evidence/webkitgtk.txt
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - run: cargo install tauri-driver --locked --version "$TAURI_DRIVER_VERSION"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - working-directory: desktop/e2e
        run: bun install --frozen-lockfile
      - name: Drive the installed window
        working-directory: desktop/e2e
        env:
          STEPWISE_APP: ${{ steps.install.outputs.app }}
          STEPWISE_EVIDENCE: ${{ github.workspace }}/evidence
        run: xvfb-run -a -s '-screen 0 1280x800x24' node --test window.test.ts
      - name: The drivers' log
        if: ${{ !cancelled() }}
        run: if [ -f evidence/tauri-driver.log ]; then cat evidence/tauri-driver.log; fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: desktop-evidence-linux-${{ matrix.format }}
          path: evidence
          if-no-files-found: error
          retention-days: 7

  # Launch tests: the window opens and its page finishes loading. What a click, a judgement or a
  # save does is the same code on every platform, which the Rust tests run everywhere.
  rpm:
    name: Launch Linux rpm in Fedora
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: fedora:43
    env:
      INSTALLER: stepwise-desktop-${{ inputs.version }}-x86_64-unknown-linux-gnu.rpm
    steps:
      - run: dnf install -y python3 xorg-x11-server-Xvfb ImageMagick
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.linux }}
          path: downloaded
      - name: The exact installer, held to its packaging job's hash
        run: python3 scripts/package/accept_desktop.py --evidence evidence identify --artifacts downloaded --name "$INSTALLER"
      - name: Install
        id: install
        run: |
          python3 scripts/package/accept_desktop.py --evidence evidence install --installer "downloaded/$INSTALLER"
          rpm -q webkit2gtk4.1 | tee evidence/webkitgtk.txt
      - name: Launch
        env:
          APP: ${{ steps.install.outputs.app }}
        run: xvfb-run -a -s '-screen 0 1280x800x24' python3 scripts/package/accept_desktop.py --evidence evidence launch --app "$APP"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: desktop-evidence-linux-rpm-fedora
          path: evidence
          if-no-files-found: error
          retention-days: 7

  appimage-bare:
    name: Launch Linux AppImage without WebKitGTK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Another distribution than the one the AppImage was built on, with no WebKitGTK and no GTK.
    # It has what an AppImage expects of any desktop and never carries itself — the X, GL, EGL,
    # font, text-shaping and sound libraries on AppImage's exclude list — and nothing more, so
    # the window must come up on what the AppImage brings. libGLESv2 is one more of the GL
    # dispatch libraries: libepoxy opens it at run time, so the AppImage neither carries it nor
    # lists it, and without it the app stops before its window.
    container: debian:13
    env:
      INSTALLER: stepwise-desktop-${{ inputs.version }}-x86_64-unknown-linux-gnu.AppImage
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - run: |
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3 xvfb xauth imagemagick \
            libegl1 libopengl0 libharfbuzz0b libfribidi0 libwayland-client0 libgpg-error0 libasound2t64 libcom-err2 libusb-1.0-0 libxcb-dri2-0 libgles2
      - name: No WebKitGTK and no GTK in this container
        run: |
          if ldconfig -p | grep -i -e webkit -e javascriptcore -e 'libgtk-3'; then
            echo "::error::the container has WebKitGTK or GTK; this would not test what the AppImage carries"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.linux }}
          path: downloaded
      - name: The exact installer, held to its packaging job's hash
        run: python3 scripts/package/accept_desktop.py --evidence evidence identify --artifacts downloaded --name "$INSTALLER"
      - name: Install
        id: install
        run: python3 scripts/package/accept_desktop.py --evidence evidence install --installer "downloaded/$INSTALLER"
      # Every library any program or library in the AppImage loads, found among its own or the
      # container's: all of them at once, where a launch would stop at the first.
      - name: Nothing the AppImage loads is missing
        env:
          APP: ${{ steps.install.outputs.app }}
        run: python3 scripts/package/accept_desktop.py --evidence evidence libraries --appimage "$APP"
      - name: Launch
        env:
          APP: ${{ steps.install.outputs.app }}
        run: xvfb-run -a -s '-screen 0 1280x800x24' python3 scripts/package/accept_desktop.py --evidence evidence launch --app "$APP"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: desktop-evidence-linux-appimage-debian
          path: evidence
          if-no-files-found: error
          retention-days: 7

  # No version of tauri-driver supports macOS, so the dmg is opened and its app launched.
  macos:
    name: Launch ${{ matrix.target }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-26
            artifact: ${{ inputs.macos-arm64 }}
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: ${{ inputs.macos-x64 }}
          - target: x86_64-apple-darwin
            os: macos-26-intel
            artifact: ${{ inputs.macos-x64 }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      INSTALLER: stepwise-desktop-${{ inputs.version }}-${{ matrix.target }}.dmg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: downloaded
      - name: The exact installer, held to its packaging job's hash
        run: python scripts/package/accept_desktop.py --evidence evidence identify --artifacts downloaded --name "$INSTALLER"
      # Gatekeeper's verdict is asserted for the signature the app has today: an ad-hoc one must
      # be refused, a Developer ID one accepted.
      - name: Verify the dmg and copy its app out
        id: install
        env:
          TARGET: ${{ matrix.target }}
        run: python scripts/package/accept_desktop.py --evidence evidence dmg --dmg "downloaded/$INSTALLER" --target "$TARGET" --destination "$RUNNER_TEMP/installed"
      - name: Launch
        env:
          APP: ${{ steps.install.outputs.app }}
        run: python scripts/package/accept_desktop.py --evidence evidence launch --app "$APP"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: desktop-evidence-${{ matrix.target }}-${{ matrix.os }}
          path: evidence
          if-no-files-found: error
          retention-days: 7
