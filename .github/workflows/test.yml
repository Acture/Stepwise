name: Test

# Pull requests only, and only the tests for what the pull request touches (changes.py).
on:
  pull_request:
  # Each packaging workflow's first job: it packages only a commit whose family's tests all pass.
  workflow_call:
    inputs:
      family:
        description: Only the tests of this family, `cli` or `desktop`; both when empty
        type: string
        default: ''

permissions:
  contents: read

# Called from a packaging workflow this is evaluated in the caller's context, so the workflow in
# the name keeps a packaging run's tests out of the group a pull request's run takes, and the
# family keeps apart the two calls one Release run makes. A packaging run queues behind one
# already running in its group instead of cancelling it; only a pull request's newer push cancels.
concurrency:
  group: test-${{ github.workflow }}-${{ inputs.family }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cli: ${{ steps.changes.outputs.cli }}
      desktop: ${{ steps.changes.outputs.desktop }}
      scripts: ${{ steps.changes.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # Outside a pull request both are empty, and every test of the family runs.
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          FAMILY: ${{ inputs.family }}
        run: python3 .github/scripts/changes.py --base "$BASE" --head "$HEAD" --family "$FAMILY"

  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s .github/scripts -v

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked
      - name: Compare with CPython
        if: runner.os == 'Linux'
        run: cargo +stable test --locked --test python_oracle -- --ignored --nocapture
      - name: Drive the terminal through a pty
        if: runner.os != 'Windows'
        run: cargo +stable test --locked --test terminal -- --ignored --nocapture
      - run: cargo +stable run --locked -- --logic --proof raa --check-proof tests/fixtures/raa.json

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: WebKitGTK and GTK for the window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      # bash, so a failing build stops the step on Windows too: PowerShell carries on past a
      # native command's exit code and would report only the last one.
      - name: The page
        working-directory: src/desktop/ui
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run build
      # A release build embeds the built page; this compiles that path, after `bun run build`.
      - run: cargo +stable check --locked -p stepwise-desktop --features tauri/custom-protocol
      # The shell's own tests: progress and appearance written, refused and left alone, themes
      # read and mapped. Installed faces are enumerated only on macOS. They open no window.
      - run: cargo +stable test --locked -p stepwise-desktop
      # The desk's types write their declarations from the library's tests, the appearance's
      # from the shell's.
      - name: The page's protocol matches the Rust types
        if: runner.os == 'Linux'
        run: |
          cargo +stable test --locked --lib desktop
          cargo +stable test --locked -p stepwise-desktop
          # Untracked counts too: a new exported type whose declaration was never committed.
          drift="$(git status --porcelain -- src/desktop/ui/src/lib/protocol)"
          if [ -n "$drift" ]; then
            echo "$drift"
            git diff src/desktop/ui/src/lib/protocol
            exit 1
          fi
